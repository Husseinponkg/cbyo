<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Management</title>
  <link rel="stylesheet" href="../css/e.css">
    <style>
       body{
    font-family: Arial, sans-serif;
    margin:20px;
}

#card{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
}

.card{
    border:1px solid #ccc;
    padding:15px;
    border-radius:8px;
}

img,
video{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
    margin-bottom:10px;
}

button{
    padding:8px 12px;
    margin-right:5px;
    cursor:pointer;
}
    </style>
</head>
<body>

    <h1>Media Upload</h1>

    <form id="mediaForm">
        <input
            type="file"
            id="file"
            accept="image/*,video/*"
            required
        >

        <button type="submit">
            Upload
        </button>
    </form>

    <hr>

    <h2>All Media Files</h2>

    <div id="card"></div>

<script>

const form = document.getElementById('mediaForm');

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    const file = document.getElementById('file').files[0];

    if (!file) {
        alert('Please select a file');
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    try {

        const response = await fetch('/media/upload', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {

            alert('Uploaded successfully');

            form.reset();

            loadAllMedia();

        } else {

            alert(data.message);
        }

    } catch (error) {

        console.error(error);
        alert('Upload failed');
    }

});


async function loadAllMedia() {

    const container = document.getElementById('card');

    try {

        const response = await fetch('/media/all');
        const mediaFiles = await response.json();

        console.log(mediaFiles);

        container.innerHTML = '';

        mediaFiles.forEach(media => {

            const card = document.createElement('div');
            card.className = 'card';

            const type = String(media.type).toLowerCase();

            if (
                type === 'image' ||
                type.includes('image')
            ) {

                card.innerHTML = `
                    <h3>${media.name}</h3>

                    <img
                        src="/uploads/images/${media.filename}"
                        alt="${media.name}"
                    >

                    <p>
                        ${new Date(
                            media.created_at
                        ).toLocaleDateString()}
                    </p>

                    <button onclick="window.open('/uploads/images/${media.filename}','_blank')">
                        Open
                    </button>

                    <a href="/uploads/images/${media.filename}" download>
                        <button>
                            Download
                        </button>
                    </a>

                    <button onclick="deleteMedia(${media.id})">
                        Delete
                    </button>
                `;

            } else if (
                type === 'video' ||
                type.includes('video')
            ) {

                card.innerHTML = `
                    <h3>${media.name}</h3>

                    <video controls>
                        <source
                            src="/uploads/videos/${media.filename}">
                    </video>

                    <p>
                        ${new Date(
                            media.created_at
                        ).toLocaleDateString()}
                    </p>

                    <button onclick="window.open('/uploads/videos/${media.filename}','_blank')">
                        Open
                    </button>

                    <a href="/uploads/videos/${media.filename}" download>
                        <button>
                            Download
                        </button>
                    </a>

                    <button onclick="deleteMedia(${media.id})">
                        Delete
                    </button>
                `;
            }

            container.appendChild(card);

        });

    } catch (error) {

        console.error(
            'Error loading media',
            error
        );
    }
}


async function deleteMedia(id) {

    if (
        !confirm(
            'Are you sure you want to delete this media?'
        )
    ) {
        return;
    }

    try {

        const response = await fetch(
            `/media/delete/${id}`,
            {
                method:'DELETE'
            }
        );

        const data = await response.json();

        if (response.ok) {

            alert(data.message);

            loadAllMedia();

        } else {

            alert(data.message);
        }

    } catch (error) {

        console.error(error);

        alert('Delete failed');
    }
}

loadAllMedia();

</script>

</body>
</html>
